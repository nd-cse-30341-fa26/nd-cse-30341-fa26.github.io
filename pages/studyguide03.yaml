  ## Multi-Level Page Table

  Given a multi-level page table with the following properties:

  <table class="bordered" markdown="1">
  <tbody markdown="1">
  <tr markdown="1">
    <td class="centered" markdown="1">`32-bit` Physical Address</td>
    <td class="centered" markdown="1">`30-bit` Virtual Address</td>
  </tr>
  <tr markdown="1">
    <td class="centered" markdown="1">`4KB` Pages</td>
    <td class="centered" markdown="1">`4 bytes` per PTE or PDE</td>
  </tr>
  </tbody>
  </table>

  **Answer the **questions** below.  When appropriate, write the **answer** as a **power of**
  `2` (*optional: simplify it in terms of `K`, `M`, `G`, or `T` units*).

  ### Pages

  1. What is the **maximum number** of **addressable bytes**?

  2. How many **pages** are there in the **virtual address space**?

  3. How many **VPN bits** are there in the **virtual address**?

  4. How many **offset bits** are there in the **virtual address**?

  ### Page Table

  1. How many **PTEs** are there in the **Page Table**?

  2. How many **bytes** are required to store just the **Page Table**?

  3. How many **pages** are required to store just the **Page Table**?

  ### Page Directory

  1. How many **PDEs** in the **Page Directory**?

  2. How many **PDI bits** are in the **VPN**?

  3. How many **PTI bits** are in the **VPN**?

  4. How many **bytes** are required to store just the **Page Directory**?

  5. How many **pages** are required to store just the **Page Directory**?

  ## Project 03

  Given the following `C` program, complete the table of `Counters` after
  executing the program using your `libmalloc-ff.so` from **Project 03**:

  ```c
  int main() {
      int **p = calloc(1<<4, sizeof(int *));

      for (int i = 0; i < 1<<4; i++) {
          p[i] = malloc(sizeof(int))
      }

      free(p);
      return 0;
  }
  ```

  <table class="bordered">
  <thead>
    <th>Counter</th>
    <th>Value</th>
  </thead>
  <tbody>
    <tr class="centered"><td style="font-weight: bold;">Free Blocks</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Mallocs</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Frees</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Reuses</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Grows</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Shrinks</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Splits</td><td>________________</td></tr>
    <tr class="centered"><td class="centered" style="font-weight: bold;">Merges</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Requested</td><td>________________</td></tr>
    <tr class="centered"><td style="font-weight: bold;">Heap Size</td><td>________________</td></tr>
  </tbody>
  </table>

  For each of the following, **identify** whether the statement is `True` or `False`.

  1. The program has significant amounts of **internal fragmentation**.
  2. At the end of the program, there is a **memory leak**.
