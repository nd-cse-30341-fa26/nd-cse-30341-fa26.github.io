title:  "Exam 03: Study Guide"
body:   |

  ## Address Space

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### Key Conceptual Questions

  1. What is an **address space**?

  2. What is **virtual memory**?

  3. How do we **allocate memory**?

  4. What are some **common memory errors**?

  </div>

  <div class="flex-col" markdown="1">

  ### Examples

  Which of following **statements** are **true**?

  1. Because each **thread** in a **process** has a separate **address space**,
  we need to use **mutexes** or **semaphores** to synchronize access to
  **critical sections**.

  2. **Malloc** is in charge of translating **virtual addresses** to **physical
  addresses**.

  3. One of the primary goals of an **address space** is to provide the
  **illusion** of **infinite memory**.

  </div>

  </div>

  ## Heap Management

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### Key Conceptual Questions

  1. Who needs to keep **track of memory**?

  2. What **data structures** do we use to keep **track of memory**?

  3. What are some **strategies** for **managing memory**?

  </div>

  <div class="flex-col" markdown="1">

  ### Examples

  Which of following **statements** are **true**?

  1. A **double free** occurs when we try to **free memory** that has already
  been **freed**.

  2. **External fragmentation** occurs when we **over allocate** a block of
  memory.

  3. While **malloc** is a **system call**, **calloc** is not.

  </div>

  </div>

  ## Virtual Memory

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### Key Conceptual Questions

  Given **base and bounds**, **segmentation**, and **paging**:

  1. What are the **advantages** and **disadvantages** of each?

  2. How does the **MMU** support each?

  </div>

  <div class="flex-col" markdown="1">

  ### Examples

  Given **base and bounds**, **segmentation**, and **paging**, which of
  following **statements** are **true**?

  1. Suffers from **external fragmentation**.

  2. Easily supports **code sharing**.

  3. Depends upon **extra hardware support** for efficient operation.

  </div>

  </div>

