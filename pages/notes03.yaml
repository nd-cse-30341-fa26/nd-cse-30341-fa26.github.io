title:  "Notes 03: System Calls"
body:   |

  ## Review

  - <div class="flex-col" markdown="1">

      What is an <strong class="caution">operating system</strong>?

      - **Taxonomy**: (*purpose*)

      - **Structure**: (*monolithic vs microkernel*)

  - <div class="flex-col" markdown="1">

      Three big themes of <strong class="caution">operating systems</strong>.

      - <strong class="success">Virtualization</strong>: Abstract hardware (*eg.
      processes -> CPU*)

      - <strong class="danger">Concurrency</strong>: Multiple things happen at
      once... **race conditions**

      - <strong class="info">Persistence</strong>: Ensure data remains available

  - <strong class="warning">System Calls</strong>: How <strong
  class="special">applications</strong> interact with the <strong
  class="caution">operating system</strong>.

  ## Review: <span class="gold">House of Cards</span>

  <div class="centered">

  <img src="static/img/slides00-house-of-cards.png" class="transparent responsive">

