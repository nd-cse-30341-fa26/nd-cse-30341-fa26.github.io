  ## System Call: <span class="gold">Overview</span>

  A <strong class="info">system call</strong> occurs when a
  <strong class="special">user application</strong> requests a
  <strong class="warning">service or resource</strong> from the
  <strong class="caution">operating system kernel</strong>.

  <table class="bordered centered">
  <tbody>
  <tr class="success-bg">
    <td height="60px"><b>I/O</b></td><td>open, read, write, close, lseek</td>
  </tr>
  <tr class="caution-bg">
    <td height="60px"><b>File</b></td><td>stat, chmod, chown, unlink</td>
  </tr>
  <tr class="info-bg">
    <td height="60px"><b>Directory</b></td><td>opendir, readdir, closedir</td>
  </tr>
  </tbody>
  </table>

  <div class="alert warning-bg centered" markdown="1">

  To track the <strong class="warning">system calls</strong> made by an
  application, we can use: <strong class="info">strace</strong>.

  </div>

  <div class="alert info-bg centered" markdown="1">

  Many of the utilities we use are thin wrappers for system calls: [chmod], [stat].

  </div>

  ```bash
  $ strace chmod -x hello         # Thin wrapper
  $ strace ls                     # More complex wrapper
  ```

  <div class="alert special-bg" markdown="1">

  To see API definitions of <strong class="warning">system calls</strong>, look
  at:

  - `/usr/include/bits/syscall.h`
  - `/usr/include/asm/unistd_{32,64}.h`

  </div>

  ```bash
  $ grep -R waitpid /usr/include  # Search for waitpid number
  ```

  [chmod]: https://man7.org/linux/man-pages/man2/chmod.2.html
  [stat]: https://man7.org/linux/man-pages/man2/stat.2.html

  ## System Call: <span class="gold">Demonstration</span>

  ```c
  /* hello.c */
  #include <stdlib.h>
  #include <unistd.h>

  int main() {                // man 2 write
      write(STDOUT_FILENO, "hello, world\n", 13);
      exit(0);
  }
  ```

  ```asm
  .section    .data
  string:
      .ascii  "hello, world\n"
  string_end:
      .equ len, string_end - string

  .section    .text
  .globl      main
  main:
      # write(1, "hello, world\n", 13)
      movl    $4, %eax        # System call number 4
      movl    $1, %ebx        # stdout has file descriptor 1
      movl    $string, %ecx   # hello, world string
      movl    $len, %edx      # string length
      int     $0x80           # Trap

      # exit(0)
      movl    $1, %eax        # System call number 1
      movl    $0, %ebx        # Argument is 0
      int     $0x80           # Trap
  ```

  <div class="alert warning-bg" markdown="1">

  To request **system call**:

  1. Record **system call number** in appropriate register.

  2. Record **argument(s)** in appropriate register(s).

  3. Trigger the **interrupt / trap**.

  ```bash
  $ strace ./hello-asm  # Doesn't work b/c it's 32-bit!!!
  ```

  </div>

  ```
  .section    .data
  string:
      .ascii  "hello, world\n"
  string_end:
      .equ len, string_end - string

  .section    .text
  .globl      main
  main:
      # write(1, "hello, world\n", 13)
      mov     $1, %rax        # System call number 1 (write)
      mov     $1, %rdi        # file descriptor 1 (stdout)
      mov     $string, %rsi   # string content
      mov     $len, %rdx      # string length
      syscall                 # Trap / Interrupt

      # exit(0)
      mov     $60, %rax       # System call 60 (exit)
      mov     $0, %rdi        # exit status
      syscall                 # Trap / Interrupt
  ```

  <div class="alert caution-bg" markdown="1">

  1. 64-bit version uses **syscall** mechanism instead of **int**.

  2. 64-bit version uses different **registers**

  3. 64-bit version has different **syscall numbers**!!!

  </div>

