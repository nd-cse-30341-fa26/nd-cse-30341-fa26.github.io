  <table class="bordered">
  <thead>
      <th class="caution-bg">Action</th>
      <th class="success-bg">Process</th>
      <th class="info-bg">Thread</th>
  </thead>
  <tbody>
  <tr>
      <td class="caution-bg centered"><b>Create new task</b></td>
      <td class="success-bg">fork + exec</td>
      <td class="info-bg">pthread_create</td>
  </tr>
  <tr>
      <td class="caution-bg centered"><b>Wait for task</b></td>
      <td class="success-bg">wait / waitpid</td>
      <td class="info-bg">pthread_join</td>
  </tr>
  <tr>
      <td class="caution-bg centered"><b>Lock critical section</b></td>
      <td class="success-bg">sigprocmask<br>SIG_BLOCK/SIG_UNBLOCK</td>
      <td class="info-bg">pthread_mutex_lock<br>pthread_mutex_unlock</td>
  </tr>
  <tr>
      <td class="caution-bg centered"><b>Notify another task</b></td>
      <td class="success-bg">sigaction / signal<br>kill</td>
      <td class="info-bg">pthread_cond_wait<br>pthread_cond_signal</td>
  </tr>
  </tbody>
  </table>

  <div class="alert danger-bg" markdown="1">

  **Project 01**: There is a race condition possible with **signals**.

  </div>

  ## Threads: <span class="gold">Many-to-One</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  <div class="alert success-bg" markdown="1">

  - Portable, flexible, straightforward to implement

  </div>

  <div class="alert danger-bg" markdown="1">

  - No parallelism
  - A thread that blocks, blocks everyone in that process

  </div>

  </div>

  <div class="flex-col" markdown="1">

  <img src="static/img/slides08-pthreads-many-to-one.svg" class="transparent responsive">

  </div>

  </div>

  ## Threads: <span class="gold">One-to-One</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  <div class="alert success-bg" markdown="1">

  - **Parallelism**: Can take advantage of extra hardware resources.
  - One thread blocking does not prevent other threads in process from running.

  </div>

  <div class="alert danger-bg" markdown="1">

  - Limits our scalability: resources ... memory usage of **stack**.

  - Limits our scalability: algorithmic ... linear search in `queue_remove`.

  - **Discuss**: Why is `fork` bomb really bad? (**Denial of service**)

  </div>

  </div>

  <div class="flex-col" markdown="1">

  <img src="static/img/slides08-pthreads-one-to-one.svg" class="transparent responsive">

  </div>

  </div>

  ## Threads: <span class="gold">Many-to-Many</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  <div class="alert success-bg" markdown="1">

  - Scalability
  - Custom scheduling / flexibility

  </div>

  <div class="alert danger-bg" markdown="1">

  - **Complex**: really hard to get right

  </div>

  </div>

  <div class="flex-col" markdown="1">

  <img src="static/img/slides08-pthreads-many-to-many.svg" class="transparent responsive">

  </div>

  </div>

  ## Threads: [counter.c](https://github.com/nd-cse-30341-fa26/examples/blob/master/lecture08/counter.c)

  ```c
  /* Globals */
  int         Counter  = 0;
  pthread_mutex_t Lock = PTHREAD_MUTEX_INITIALIZER;

  /* Functions */

  void *update_counter(void *arg) {   // Background thread
      while (true) {                  // Version 0: Just count (no loop)
          usleep(TIMEOUT * 1000);
          pthread_mutex_lock(&Lock);  // Version 1: No lock
          Counter += 1;
          pthread_mutex_unlock(&Lock);
      }

      return NULL;
  }

  /* Main execution */

  int main(int argc, char *argv[]) {
      // Background Thread - Update Loop
      pthread_t thread;
      pthread_create(&thread, NULL, update_counter, 0);

      // Foreground Thread - I/O Loop
      while (true) {
          char buffer[BUFSIZ];

          // Display prompt
          fputs(PROMPT, stdout); fflush(stdout);

          // Read input
          if (!fgets(buffer, BUFSIZ, stdin)) {
              break;
          }
          buffer[strlen(buffer) - 1] = 0;

          // Process input
          if (strcmp(buffer, "count") == 0) {
              pthread_mutex_lock(&Lock);    // Version 1: No locks
              fprintf(stdout, "Counter is %d\n", Counter);
              pthread_mutex_unlock(&Lock);
          } else if (strcmp(buffer, "reset") == 0) {
              pthread_mutex_lock(&Lock);    // Version 1: No locks
              Counter = 0;
              pthread_mutex_unlock(&Lock);
              fputs("Counter is reset!\n", stdout);
          } else if (strcmp(buffer, "exit") == 0) {
              fputs("Bye!\n", stdout);
              break;
          } else {
              fprintf(stderr, "Unknown command: %s\n", buffer);
          }
      }

      return 0;
  }
  ```

  <div class="alert warning-bg" markdown="1">

  **Notes**:

  - `#include <pthread.h>`
  - `man pthread_create`
  - Add `-pthread` to `Makefile`
  - Try with **big** input (ie. `yes count > input`)

  **Questions**:

  - Why didn't I need to create a foreground thread? *main*
  - What happens if main thread dies? *everything dies*
  - Is it correct? What is dangerous? *race condition*

  </div>

  ## Threads: <span class="gold">Disassembly</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### <span class="danger">Background Thread</span>

  Counter++

  ```
  LOAD  $Counter, R1
  ADD   R1, 1
  STORE $Counter, R1
  ```

  </div>

  <div class="flex-col" markdown="1">

  ### <span class="success">Foreground Thread</span>

  Counter = 0

  ```
  STORE $Counter, 0
  ```

  </div>

  </div>
