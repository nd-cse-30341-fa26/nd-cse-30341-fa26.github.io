  ## Concurrency: <span class="gold">Questions</span>

  1.  <div class="flex-col" markdown="1">

      What exactly is <strong class="success">concurrency</strong>? <strong
      class="danger">parallelism</strong>?

      - What are some <strong class="caution">examples</strong>?

      - What are some <strong class="special">challenges</strong>?

  2.  <div class="flex-col" markdown="1">

      How do we <strong class="caution">overlap I/O and compute</strong> within
      a single <strong class="success">process</strong>?

      - What <strong class="warning">system calls</strong> can we use?

      - How do we use these <strong class="warning">system calls</strong>?

  ## Concurrency: <span class="gold">Motivation</span>

  We want to create an application, `counter`, that does the following:

  - Periodically **increments a `counter`**.

  - Provides a **shell prompt** that allows the user to enter in a **`command`**:

  <table class="bordered">
  <thead>
    <th class="info-bg">Command</th>
    <th class="success-bg">Description</th>
  </thead>
  <tbody>
  <tr>
    <td class="info-bg centered"><b>count</b></td>
    <td class="success-bg">Returns the current value of <code>counter</code></td>
  </tr>
  <tr>
    <td class="info-bg centered"><b>reset</b></td>
    <td class="success-bg">Resets counter to <code>0</code></td>
  </tr>
  <tr>
    <td class="info-bg centered"><b>exit</b></td>
    <td class="success-bg">Quit program</td>
  </tr>
  </tbody>
  </table>

  ## Concurrency: <span class="gold">Overview</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  Whenever we structure a problem such that we have <strong
  class="caution">multiple streams of execution</strong>, we have <strong
  class="success">concurrency</strong>.

  <div class="centered">

  <img src="static/img/slides07-client-server-single.svg" class="transparent responsive">

  </div>

  </div>

  <div class="flex-col" markdown="1">

  Whenever we have the <strong class="info">hardware resources</strong> to
  simultaneously execute <strong class="caution">multiple streams of
  executions</strong>, we have <strong class="danger">parallelism</strong>.

  <div class="centered">

  <img src="static/img/slides07-client-server-multi.svg" class="transparent responsive">

  </div>

  </div>

  </div>

  <div class="alert warning-bg" markdown="1">

  Issues with <strong class="success">concurrency</strong> and <strong
  class="warning">scheduling</strong>: Hard to know **order of execution**.

  </div>

  ## Concurrency: <span class="gold">Internal</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col-33" markdown="1">

  <div class="centered">

  <img src="static/img/slides07-process.svg" class="transparent">

  </div>

  ### <strong class="success">Concurrent tasks</strong>

  1. <strong> Update counter</strong>

  2. <strong> Handle shell input</strong>

  </div>

  <div class="flex-col" markdown="1">

  In addition to <strong class="caution">inter-process concurrency</strong>, we
  can also have <strong class="success">internal concurrency</strong> within a
  single <strong class="success">process</strong>:

  1. <strong> Foreground vs Background</strong>

  2. <strong> Mixing I/O and Computation</strong>

  3. <strong> Signals</strong>

  </div>

  </div>

  <div class="alert warning-bg" markdown="1">

  #### Example Applications:

  - **GrubHub**: Display UI / Animation while requests happen in the
  background.

  - **Instagram**: Apply filter in the background.

  </div>

  ## Concurrency: <span class="gold">Threads</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  We can implement <strong class="success">internal concurrency</strong> by
  dividing a <strong class="success">process</strong> into <strong
  class="caution">multiple streams of execution</strong>.

  #### Review: <strong class="success">Machine State</strong>

  1. <strong>Address Space</strong> [~]

  2. <strong>Kernel State</strong> [v]

  3. <strong>Execution Context</strong> [x]

  </div>

  <div class="centered">

  <img src="static/img/slides07-threads.svg" class="transparent responsive">

  </div>

  </div>

  ## Concurrency: <span class="gold">Interview Question</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  **Given**

  ```c
  int f() {
      int i;
      ...
  }
  ```

  <div class="centered" markdown="1">

  If <strong class="caution">two threads</strong> run `f()`,<br>is there <strong
  class="danger">sharing</strong>?

  <br>

  <div class="alert success-bg" markdown="1">

  No, `i` is on the **stack**.

  </div>

  </div>

  </div>

  <div class="flex-col" markdown="1">

  **Given**

  ```c
  int g(char *s) {
      *s = ____;
      ...
  }
  ```

  <div class="centered" markdown="1">

  If <strong class="caution">two threads</strong> run `g()`,<br>is there <strong
  class="danger">sharing</strong>?

  <br>

  <div class="alert warning-bg" markdown="1">

  Maybe, depends on what `s` is pointing to.

  </div>

  </div>

  </div>

  </div>

  ## Concurrency: <span class="gold">Sharing Problem</span>

  1. <strong class="danger">Shared Data</strong> -> <strong
  class="danger">Critical Section</strong>

  2. <strong class="info">Uncontrolled Scheduling</strong> -> <strong
  class="info">Race Condition</strong>

  3. <strong class="success">Need for Atomicity</strong> -> <strong
  class="success">Mutual Execution</strong>

  <div class="alert warning-bg" markdown="1">

  **Concurrency** is hard... example of non-obvious **race condition** from
  **Project 01**:

  ```c
  void scheduler_handle_signal(int signum) {
      scheduler_wait(&PQSHScheduler); // Can interrupt walking the list!
      scheduler_next(&PQSHScheduler);
  }
  ```

  Even [OpenSSH](https://access.redhat.com/security/cve/cve-2024-6409) fell
  victim to this!!!

  </div>

  ## Events: <span class="gold">Overview</span>

  If we only need to <strong class="caution">overlap I/O and
  computation</strong>, we can use <strong class="primary">events</strong> to
  provide <strong class="success">concurrency</strong> without <strong
  class="danger">parallelism</strong>:

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  - Register interest in <strong class="primary">events</strong> (*callbacks*).

  - <strong class="info">Event loop</strong> waits for <strong
    class="primary">event</strong> and then invokes <strong
    class="success">handlers</strong>.

  - <strong class="success">Handlers</strong> generally **short-lived** and not
    **pre-empted**.

  </div>

  <div class="flex-col" markdown="1">

  <div class="centered">

  <img src="static/img/slides07-event-loop.svg" class="transparent responsive">

  </div>

  </div>

  </div>

  ## Events: [counter.c](https://github.com/nd-cse-30341-fa26/examples/blob/master/lecture07/counter.c)

  ```c
  int main(int argc, char *argv[]) {
      bool prompt  = true;
      int  counter = 0;
      char buffer[BUFSIZ];

      while (true) {
          /* Display prompt */
          if (prompt) {
              fputs(PROMPT, stdout); fflush(stdout); prompt = false;
          }

          /* Poll STDIN */
          struct pollfd pfd = {STDIN_FILENO, POLLIN|POLLPRI, 0};
          int    result     = poll(&pfd, 1, TIMEOUT);

          /* Process event */
          if (result < 0) {           /* Error */
              fprintf(stderr, "Unable to poll: %s\n", strerror(errno));
          } else if (result == 0) {   /* Update counter */
              counter++;
          } else {                    /* Handle command */
              if (!fgets(buffer, BUFSIZ, stdin)) {
                  break;
              }

              buffer[strlen(buffer) - 1] = 0;

              if (strcmp(buffer, "count") == 0) {
                  fprintf(stdout, "Counter is %d\n", counter);
              } else if (strcmp(buffer, "reset") == 0) {
                  counter = 0;
                  fputs("Counter is reset!\n", stdout);
              } else if (strcmp(buffer, "exit") == 0) {
                  fputs("Bye!\n", stdout);
                  break;
              } else {
                  fprintf(stderr, "Unknown command: %s\n", buffer);
              }

              prompt = true;
          }
      }

      return 0;
  }
  ```

  <div class="alert warning-bg" markdown="1">

  ```bash
  $ yes count > input

  $ ./counter < input
  ```

  - **DDOS**!!!

  - **Handlers** should be **short-lived**.

  - **Concurrency**, but no **parallelism**.

  </div>
