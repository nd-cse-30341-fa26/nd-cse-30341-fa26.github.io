  ## Scheduling: <span class="gold">Questions</span>

  1. What is the purpose of a <strong class="caution">scheduler</strong>?

  2. When does a <strong class="caution">scheduler</strong> execute?

  3. What are some common <strong class="warning">scheduling policies</strong>?

  4. How do we <strong class="danger">evaluate</strong> a <strong
  class="warning">scheduling policy</strong>?

  ## Scheduling: <span class="gold">Purpose</span>

  > What is the purpose of a <strong class="success">scheduler</strong>?

  - The <strong class="success">scheduler</strong> determines which <strong
  class="primary">process</strong> runs next.

  - The decision making process is called a <strong class="warning">scheduling
  policy</strong> (<i class="muted">discipline</i>).

  <div class="alert info-bg" markdown="1">

  For [Project 01]: Need to consider **multi-core**!

  </div>

  <div class="alert success-bg" markdown="1">

  **OS kernel** wants to maximize **resource utilization**.

  </div>

  ## Process: <span class="gold">Life Cycle</span> (<i class="muted">Review</i>)

  <div class="centered">

  <img src="static/img/slides04-process-life-cycle.png" class="transparent responsive">

  </div>

  <div class="alert info-bg" markdown="1">

  **System Calls**:

  - `fork`: **allocate** child process.
  - `exec`: **reset** address space and execution context.
  - `exit`: **terminate** and tell parent exit status.
  - `wait`: **retrieve** child exit status and **deallocate** child process.

  **Project 01**:

  - Use [execvp] to handle programs with command line arguments.
  - Use [waitpid] to avoid **blocking**.

  **Reading 03**:

  - Explain `pid = wait(&status)` and `WEXITSTATUS(status)`.

  </div>

  [execvp]: https://man7.org/linux/man-pages/man3/exec.3.html
  [waitpid]: https://man7.org/linux/man-pages/man2/wait.2.html

