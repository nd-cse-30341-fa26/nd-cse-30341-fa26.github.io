  ## Review

  > The purpose of [Project 01] is to create **shell** that executes and
  manages **processes**.

  -   <div class="flex-col" markdown="1">

      **Two Queues**:

      - **Running**: **processes** are given CPU time.
      - **Waiting**: **processes** are not given CPU time.

  <div class="alert info-bg" markdown="1">

  **Demonstrate** scheduler in action with [video](https://pnutz.h4x0r.space/courses/cse.30341.fa26/project01.html#reference-implementation)

