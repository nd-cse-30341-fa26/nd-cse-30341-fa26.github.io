title:  "Notes 14-A: Memory API, Free-Space Management"
body:   |

  ## Review: <span class="gold">Address Space, Translation</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  **Virtualization**:

  - **Address Space** -> **Address Translation**

  - **Base & Bounds**

  - **MMU**

  <div class="alert warning-bg" markdown="1">

  - Memory **allocation** is **reservation** (*hotel analogy*).

  - **Stack**: automatic, fast, but limited.

  - **Heap**: user managed, slow, but *virtually* unlimited.

  </div>

  </div>

  <div class="flex-col" markdown="1">

  <img src="static/img/slides13-address-space-virtualization.svg" class="transparent responsive">

