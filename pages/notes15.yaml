  ## Review: <span class="gold">Free List</span>

  > What <strong class="primary">data structure</strong> do we use to keep
  track of memory? <strong class="primary">Free List</strong>

  - **Three levels**: <strong class="caution">OS</strong>, <strong
  class="warning">Runtime</strong>, <strong class="success">Process</strong>

  - <strong class="success">Process</strong> uses `C` library to track <strong
  class="success">heap allocation</strong>.

  <div class="centered">

  <img src="static/img/slides14-sbrk-marked.svg" class="transparent responsive">

  </div>

  - [sbrk] changes the location of the **program break**, which is the between
  the <strong class="caution">data segment</strong> and the <strong
  class="success">heap segment</strong>.

  - Initially, the <strong class="success">heap</strong> is empty, so when we
  call [sbrk] we are **growing** the <strong class="success">heap</strong>
  (<strong class="caution">data</strong> never grows).

  <div class="alert warning-bg" markdown="1">

  We can **shrink** the <strong class="success">heap</strong> with a **negative
  value**, but we must be careful to not release **allocated** blocks that are
  **still in use**.

  Moreover, since [sbrk] can be expensive, we want to avoid shrinking until we
  have a large enough chunk at the top of the <strong class="success">heap</strong> (ie.
  `TRIM_THRESHOLD`).

  </div>

  <div class="alert info-bg" markdown="1">

  [Project 03]: Our <strong class="primary">free list</strong> holds **old**
  but **unused** (ie.  `free`) allocations.

  </div>

  [Project 03]: project03.html

  ## Heap Allocation: [malloc1.c]

  > Rather than always calling [sbrk] to allocate more space, try to **re-use**
  previous allocations from <strong class="primary">free list</strong>.

  1. <strike>Explain `struct Block` (*attributes, alignment, size*).</strike>
  2. <strike>Implement `malloc` (*begin*).</strike>
  3. <strike>Implement `free_list_search` (*discuss fit algorithms*).</strike>
  4. <strike>Implement `malloc` (*continue*).</strike>
  5. <strike>Implement `block_allocate`.</strike>
  6. Implement `block_detach`.
  7. Complete `malloc`.
  8. Implement `free`.
  9. Implement `free_list_insert`.

  ```c
  /* Block Constants */

  #define ALIGNMENT       (sizeof(double))
  #define ALIGN(size)     (((size) + (ALIGNMENT - 1)) & ~(ALIGNMENT - 1))
  #define SBRK_FAILURE    ((void *)(-1))

  /* Block Macros */

  #define BLOCK_FROM_POINTER(ptr) \
      (Block *)((intptr_t)(ptr) - sizeof(Block))

  /* Block Structure
   *
   *  [       ]
   *  [       ] <- Block - Data (contents)
   *  [       ] <- Block - Header (struct)
   *
   **/
  typedef struct block Block;
  struct block {
      size_t   capacity;  /* Number of bytes allocated to block */
      size_t   size;      /* Number of bytes used by block */
      Block *  prev;      /* Pointer to previous block structure */
      Block *  next;      /* Pointer to next block structure */
      char     data[];    /* Label for user accessible block data */
  };                      /* sizeof(Block) = 8 + 8 + 8 + 8 = 32 bytes */

  Block * block_allocate(size_t size) {
      intptr_t allocated = sizeof(Block) + ALIGN(size);
      Block *  block     = sbrk(allocated);
      if (block == SBRK_FAILURE) {
          return NULL;
      }

      block->capacity = ALIGN(size);
      block->size     = size;
      block->prev     = block;
      block->next     = block;
      return block;
  }

  Block * block_detach(Block *block) {
      /* Update prev and next blocks to reference each other
       *
       *  [ before ]<->[ block ]<->[ after ]
       *
       *  [ before ]<->[ after ]
       *
       **/
      if (block) {
          Block *before = block->prev;
          Block *after  = block->next;

          before->next  = after;
          after->prev   = before;

          block->next   = block;
          block->prev   = block;
      }

      return block;
  }

  /* Free List Global Variable */

  Block FreeList = {0, 0, &FreeList, &FreeList};

  /* Free List Functions */

  Block * free_list_search(size_t size) {
      /* Perform first fit algorithm: find first block largest to satisfy request */
      for (Block *curr = FreeList.next; curr != &FreeList; curr = curr->next) {
          if (curr->capacity >= size) {
              return curr;
          }
      }

      /* Best fit algorithm: find smallest block to satisfy request in order to
      minimize internal fragmentation */

      /* Worst fit algorithm: find largest block to satisfy request in order to
      minimize external fragmentation */

      return NULL;
  }

  void    free_list_insert(Block *block) {
      /* Append to tail
       *
       *  [ tail ]<->[ FreeList ]
       *
       *  [ tail ]<->[ block ]<->[ FreeList ]
       *
       **/
      Block *tail   = FreeList.prev;

      tail->next    = block;
      FreeList.prev = block;
      block->next   = &FreeList;
      block->prev   = tail;
  }

  /* POSIX API Functions */

  /**
  * Allocate specified amount memory.
  * @param   size    Amount of bytes to allocate.
  * @return  Pointer to the requested amount of memory.
  **/
  void *malloc(size_t size) {
      /* Handle empty size */
      if (!size) {
          return NULL;
      }

      /* Search free list for any available block with matching size */
      Block *block = free_list_search(size);

      if (!block) {
          block = block_allocate(size);
      } else {
          block = block_detach(block);
      }

      /* Could not find free block or allocate a block, so just return NULL */
      if (!block) {
          return NULL;
      }

      /* Return data address associated with block */
      return block->data;
  }

  /**
  * Release previously allocated memory.
  * @param   ptr     Pointer to previously allocated memory.
  **/
  void free(void *ptr) {
      if (!ptr) {
          return;
      }

      Block *block = BLOCK_FROM_POINTER(ptr);
      free_list_insert(block);
  }
  ```

  > What <strong class="danger">issues</strong> and <strong
  class="danger">challenges</strong> (*and **mechanism** to address*)?

  -   <div class="flex-col" markdown="1">

      <strong class="danger">Internal Fragmentation</strong> - **Overallocation**
  -> <strong class="special">Splitting</strong> (*during `malloc`*).


      - Draw a **picture**!

  -   <div class="flex-col" markdown="1">

      <strong class="danger">External Fragmentation</strong> - Not enough
  **contiguous allocation** -> <strong class="comment">Coalescing</strong> (*during `free`*).

      - Insert in **sorted** order.

      - Need two call `block_merge` twice (**after**, **before**).

