  ## Segmentation: <span class="gold">Overview</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  <strong class="warning">Segmentation</strong> is a generalized form of <strong
  class="warning">base and bounds</strong>:

  - Each component in the <strong class="success">address space</strong> is
    considered a separate <strong class="caution">segment</strong>.

  - Each <strong class="caution">segment</strong> has its own <strong
    class="warning">base and bounds registers</strong>.

  </div>

  <div class="flex-col-33" markdown="1">

  <img src="static/img/slides15-segmentation-overview.svg" class="transparent responsive">

  </div>

  </div>

  ## Segmentation: <span class="gold">Segments</span>

  Because our <strong class="success">address space</strong> is split into
  separate <strong class="caution">segments</strong>, we have some additional
  issues and opportunities:

  - <strong class="primary">Code Sharing</strong>: We can now share common
    <strong class="danger">code segments</strong> (<strong><i class="muted">ie.
    multiple instances of programs</i></strong>)

  - <strong class="comment">Growth Direction</strong>: While most <strong
    class="caution">segments</strong> such as <strong
    class="success">heap</strong> grow in positive direction, the <strong
    class="info">stack</strong> grows downwards.

  <div class="alert warning-bg" markdown="1">

  - <strong class="warning">Ubuntu</strong> has switched to **Rust**
  coreutils... by default **Rust** applications are <strong
  class="danger">statically linked</strong>... is this an issue when it comes
  to <strong class="primary">code sharing</strong>? <strong class="danger">more
  memory usage because libraries can't be shared</strong>

  - <strong class="warning">Ubuntu</strong> actually uses <strong
  class="success">dynamic linking</strong> and ... compiles all the programs
  into a <strong class="caution">single binary with hardlinks</strong> for each
  utility... is this also an issue?  <strong class="success">no because the
  binary can be loaded once and shared for each utility</strong>.

  </div>

  <div class="alert info-bg" markdown="1">

  In addition to the <strong class="warning">base and bounds</strong>, we will need
  <strong class="special">accounting information</strong>!

  </div>

  ## Segmentation: <span class="gold">Hardware Information</span>

  To support <strong class="warning">segmentation</strong>, the <strong
  class="info">MMU</strong> now needs to know the following information:

  <table class="bordered">
  <thead>
      <th class="special-bg">Segment</th>
      <th class="special-bg">Base</th>
      <th class="special-bg">Size</th>
      <th class="special-bg">Growth Positive?</th>
      <th class="special-bg">Protection</th>
  </thead>
  <tbody>
  <tr class="danger-bg">
      <td class="centered">Code</td>
      <td class="centered">32K</td>
      <td class="centered">2K</td>
      <td class="centered">1</td>
      <td class="centered">Read-Execute</td>
  </tr>
  <tr class="caution-bg">
      <td class="centered">Data</td>
      <td class="centered">34K</td>
      <td class="centered">2K</td>
      <td class="centered">1</td>
      <td class="centered">Read-Write</td>
  </tr>
  <tr class="success-bg">
      <td class="centered">Heap</td>
      <td class="centered">36K</td>
      <td class="centered">2K</td>
      <td class="centered">1</td>
      <td class="centered">Read-Write</td>
  </tr>
  <tr class="info-bg">
      <td class="centered">Stack</td>
      <td class="centered">28K</td>
      <td class="centered">2K</td>
      <td class="centered">0</td>
      <td class="centered">Read-Write</td>
  </tr>
  </tbody>
  </table>

  <strong class="caution">Operating system</strong> must track this information
  for every <strong class="success">process</strong> and save and restore it on
  each <strong class="special">context switch</strong>.

  ## Segmentation: <span class="gold">Address Translation</span>

  Given the following `16-bit` <strong class="warning">virtual address</strong>:

  <div class="centered">

  <img src="static/img/reading08-address.svg" class="transparent responsive">

  </div>

  <div class="alert warning-bg" markdown="1">

  - Why `2-bits` for <strong class="caution">segments</strong>? `4`

  </div>

  1.  <div class="flex-col" markdown="1">

      What is the <strong class="danger">largest possible segment size</strong>?

          :::text
          2^14 = 2^4 * 2^10 = 16 K

  2.  <div class="flex-col" markdown="1">

      What is the <strong class="success">maximum possible offset value</strong>?

          :::text
          2^14 - 1 = 11 1111 1111 1111
                   = 3  F    F    F
                   = 16383

  3.  <div class="flex-col" markdown="1">

      Which <strong class="caution">segment</strong> is this <strong
      class="warning">virtual address</strong> located in?

      <strong class="success">heap</strong>

  4.  <div class="flex-col" markdown="1">

      What is the <strong class="info">physical address</strong> of this
      <strong class="warning">virtual address</strong>?

          :::text
          PA = 36K + Offset = 36K + 522 = 37386

  ## Segmentation: [Reading 08]

  ```c
  /* Constants */

  #define KB              (1<<10)
  #define SEGMENT_MASK    (0xC000)
  #define SEGMENT_SHIFT   (14)
  #define OFFSET_MASK     (~SEGMENT_MASK)

  /* Structures */

  typedef struct {
      uint16_t base;
      uint16_t size;
  } SegmentRecord;

  /* Constants */

  SegmentRecord MMU[] = {
      {.base = 32*KB, .size = 2*KB},   /* 00: Code  */
      {.base = 34*KB, .size = 2*KB},   /* 01: Data  */
      {.base = 36*KB, .size = 2*KB},   /* 10: Heap  */
      {.base = 28*KB, .size = 2*KB},   /* 11: Stack */
  };

  int main(int argc, char *argv[]) {
      uint16_t virtual_address;

      while (fread(&virtual_address, sizeof(uint16_t), 1, stdin)) {
          uint16_t segment = (virtual_address & SEGMENT_MASK) >> SEGMENT_SHIFT;
          uint16_t offset  = (virtual_address & OFFSET_MASK);

          char   *fault    = "";
          if (offset >= MMU[segment].size) {
              fault = " Segmentation Fault";
          }

          uint16_t physical_address = MMU[segment].base + offset;
          printf("VA[%04hx] -> PA[%04hx]%s\n", virtual_address, physical_address, fault);
      }

      return EXIT_SUCCESS;
  }
  ```

  [Reading 08]: reading08.html

  ## Segmentation: <span class="gold">Problems</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  Unfortunately, <strong class="warning">segmentation</strong> suffers from a major
  <strong class="danger">problem</strong>:

  > <strong class="danger">External fragmentation</strong>: the
  > variable sized <strong class="warning">segments</strong> leads to many tiny
  > <strong class="caution">holes</strong>.

  - We can compact <strong class="caution">segments</strong>, but that is <strong
    class="danger">expensive</strong>.

  - We can rely on <strong class="primary">free-list</strong> management
    algorithms, but they can only <strong class="caution">minimize
    fragmentation</strong>.

  <div class="alert warning-bg" markdown="1">

  **Analogy**: Packing a suitcase (*regular sized things*)

  </div>

  </div>

