  ## Virtualization: <span class="gold">Lies</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  1. **Infinite** Memory

  2. **Contiguous** Allocation

  3. **Dedicated** Ownership

  <div class="alert success-bg" markdown="1">

  **Restaurant Analogy**: Raising Cane's

  </div>

  - To implement this <strong class="special">lie</strong>, we need to perform
  <strong class="success">address translation</strong>.

  - To perform <strong class="success">translation</strong>, we rely on <strong
  class="info">MMU</strong> to do it on-demand in hardware.

  <div class="alert warning-bg" markdown="1">

  **Base and Bounds**:

  1. <strong class="danger">Internal Fragmentation</strong>

  2. <strong class="danger">Can't easily grow</strong>

  </div>

