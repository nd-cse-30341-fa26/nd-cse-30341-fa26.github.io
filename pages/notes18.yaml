title:  "Notes 18: Swapping"
body:   |

  ## Logistics

  - [Interview 03](interview03.html): Memory Bugs in the context of `malloc`.

  - [Study Guide 03](studyguide03.html): Review.

  ## Review: <span class="gold">Virtual Memory</span> (<i class="muted">Lies</i>)

  1. **Dedicated ownership**: **MMU** enforces
  2. **Contiguous**: **Paging** makes it appear that way
  3. **Infinite**: **Swapping** gives us more (*slower*) memory

  ## Swapping: <span class="gold">Questions</span>

  1. How does the <strong class="caution">operating system</strong> provide the
  <strong class="special">illusion</strong> of <strong class="success">infinite
  virtual memory</strong>?

  2. How does the <strong class="caution">operating system</strong> handle
    <strong class="warning">page faults</strong>?

  3. What exactly is <strong class="danger">thrashing</strong>?

  ## Virtual Memory: <span class="gold">Infinite Allocation</span>

  ```c
  #include <stdio.h>
  #include <stdlib.h>

  #define N 30

  int main(int argc, char *argv[]) {
      while (1) {
          int *a = malloc(sizeof(int)*(1<<N));    // Allocate memory on the heap
          for (int i = 0; i < (1<<N); i++) {      // Use Allocation
              a[i] = i;
          }
      }
      return 0;
  }
  ```

  <div class="alert warning-bg" markdown="1">

  **Observations**:

  - `127TB` **virtual memory**.
  - **Physical memory** isn't actually allocated until used.

  **Discussion**:

  - Most **Physical Memory (500MB)** is due to **Page Table**!

  - **COW**: `fork()` conceptually copies **address space**, but underneath
  just has a reference and only copies on modification.

  </div>

