title:  "Notes 06: Scheduling (MLFQ, Lottery)"
body:   |

  ## Logistics

  - [Interview 01](interview01.html): Signup for time slots

  ## Scheduling: <span class="gold">Review</span>

  -   <div class="flex-col" markdown="1">

      **Scheduling Processes**

      > We want to run multiple jobs at once, but each job needs the **CPU**.  So
      what we do is we abstract **CPUs** as **process** (ie. **machine state**)
      and store them in a **queue** for selection.

  -   <div class="flex-col" markdown="1">

      **Scheduling Activation**

      1. **Process** terminates.
      2. **Process** initiates system call.
      3. **Process** interrupted by timer.

  ## Scheduling: <span class="gold">Questions</span>

  1.  <div class="flex-col" markdown="1">

      What are the <strong class="success">strengths</strong> and <strong
      class="danger">weaknesses</strong> of:

      - <strong class="gold">FIFO</strong> Scheduling
      - <strong class="gold">Round Robin</strong> Scheduling

  2. How does <strong class="special">MLFQ</strong> address these <strong
  class="danger">weaknesses</strong>?

  3. How does <strong class="special">Lottery</strong> address these <strong
  class="danger">weaknesses</strong>?

  <div class="alert info-bg" markdown="1">

  #### Review: Assumptions

  1. Same amount of time
  2. Arrive at the same time
  3. Each job runs to completion
  4. Only CPU (no I/O)
  5. Run-time is known

  </div>

