  <div class="alert success-bg" markdown="1">

  **Optimize** for **low latency**.

  </div>

  </div>

  <div class="flex-col" markdown="1">

  ### <span class="caution">Handheld</span>

  Usually found in *PDAs* or *mobile phones*

  <div class="centered">
      <img src="https://p4-ofp.static.pub//fes/cms/2024/08/28/82b5rafgf57ap23fcdgtk1i9hxek5u880251.png" class="transparent responsive">
