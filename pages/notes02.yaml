  ## OS Taxonomy: <span class="gold">By Purpose</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### <span class="danger">Mainframe</span>

  Process many jobs or tasks at once (*time-sharing, transaction processing, batch*)

  <div class="centered">
      <img src="https://images.computerhistory.org/revonline/images/500004505-03-01.jpg?w=400" class="responsive">
  </div>

  <div class="alert info-bg" markdown="1">

  **COBOL** still alive today.

  </div>

  </div>

  <div class="flex-col" markdown="1">

  ### <span class="success">Server</span>

  Provide services to multiple users (*print, filesharing, web, etc.*)

