      <img src="https://i.dell.com/is/image/DellContent//content/dam/images/products/servers/poweredge/r440/dellemc-per440-8x2-5-lcd-above-ff.psd?fmt=png-alpha&pscan=auto&scl=1&hei=402&wid=1344&qlt=100,1&resMode=sharp2&size=1344,402&chrss=full" class="transparent responsive">
