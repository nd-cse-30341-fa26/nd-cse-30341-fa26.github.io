  ## OS Taxonomy: <span class="gold">By Structure</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### <span class="danger">Monolithic</span>

  A **single** program running in **kernel** mode.

  </div>

  <div class="flex-col" markdown="1">

  ### <span class="success">Microkernel</span>

  **Multiple** programs working together with the help of a *privileged*
  **intermediary**.

  </div>

  </div>

