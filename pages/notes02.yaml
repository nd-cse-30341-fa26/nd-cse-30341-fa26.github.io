  </div>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### <span class="special">Personal</span>

  Support a single user (like your *laptop* or *desktop*)

  <div class="centered">
      <img src="https://i.dell.com/is/image/DellContent//content/dam/ss2/product-images/dell-client-products/notebooks/latitude-notebooks/14-7420-2in1/media-gallery/la7420t_ctb_00030rf120_bk_5000x5000_gettyimages-1197597312_revised.psd?fmt=png-alpha&pscan=auto&scl=1&wid=4652&hei=2777&qlt=100,1&resMode=sharp2&size=4652,2777&chrss=full&imwidth=420" class="transparent responsive">
