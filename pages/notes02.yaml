  ## OS Themes: <span class="gold">An Operating System is...</span>

  A <strong class="caution">body of software</strong> that enables other programs
  to interact with each other and the <strong class="info">physical hardware
  resources</strong> in an efficient manner.  To do this, it utilizes:

  - <strong class="success">Virtualization</strong>

  - <strong class="danger">Concurrency</strong>

  - <strong class="info">Persistence</strong>

  ## OS Themes: <span class="gold">Virtualization</span>

  This is when the <strong class="caution">OS</strong> takes a <strong
  class="info">physical resource</strong> and transforms it into a more
  general, powerful, and easy-to-use <strong
  class="success">abstraction</strong>.

  ```bash
  # Create spin script
  $ cat > spin.sh <<EOF
  #!/bin/sh
  while true; do
      echo $1
      sleep 1
  done
  EOF

  # Make script executable
  $ chmod +x spin.sh

  # Run multiple processes
  $ ./spin.sh A & \
    ./spin.sh B & \
    ./spin.sh C & \
    ./spin.sh D
  ```

  <div class="alert info-bg centered" markdown="1">

  What is being **virtualized**?

  **CPU (*HW*)** -> **Process (*Abstraction*)**

  </div>

  <div class="alert warning-bg centered" markdown="1">

  Do you observe anything **weird** with the **output**?

  **CPU (*HW*)** -> **Process (*Abstraction*)**

  </div>

  <div class="alert danger-bg centered" markdown="1">

  How do we **stop** the **processes**?

  pkill -9 spin.sh

  </div>

  ## OS Themes: <span class="gold">Concurrency</span>

  This is when you have multiple tasks <strong
  class="success">executing</strong> and <strong class="caution">utilizing
  resources</strong> in **overlapping time periods**.

  ```bash
  # Create inc script
  $ cat > inc.sh <<EOF
  #!/bin/sh
  [ ! -r count ] && echo 0 > count  # Test command, short circuit evaluation

  while true; do
      c=$(cat count)                # Command substitution
      echo $(($c + 1)) | tee count  # Arithmetic, pipelining
      sleep 1
  done
  EOF

  # Run multiple processes
  $ ./inc.sh A & \
    ./inc.sh B & \
    ./inc.sh C & \
    ./inc.sh D
  ```

  <div class="alert warning-bg centered" markdown="1">

  Do you notice any **issues** when running **concurrently**?

  **Repeats** due to **race condition**

  </div>

  ## OS Themes: <span class="gold">Persistence</span>

  This is the ability to <strong class="caution">access</strong> and <strong
  class="warning">store</strong> data in a <strong
  class="success">reliable</strong> and <strong
  class="success">efficient</strong> manner.

  ```c
  // For each command line argument, open the file and
  // perform cat on the file descriptor
  int main(int argc, char *argv[]) {
      if (argc == 1) return cat_fd(STDIN_FILENO);

      int result = 0;
      for (int i = 1; i < argc; i++) {
          int fd  = open(argv[i], O_RDONLY);
          result += (fd >= 0) ? cat_fd(fd) : EXIT_FAILURE;
      }

      return result;
  }

  // Read a chunk from the file descriptor and
  // write it to stdout
  int cat_fd(int fd) {
      char buffer[BUFSIZ];
      int nread;

      while ((nread = read(fd, buffer, BUFSIZ)) > 0) {
          // TODO: Check if write fails
          write(STDOUT_FILENO, buffer, nread);
      }

      return close(fd);
  }
  ```

  <div class="alert info-bg centered" markdown="1">

  How to check which **system calls** are used?

  **strace**

  </div>

  ## OS Themes: <span class="gold">Hardware / OS Symbiosis</span>

  Computer <strong class="info">hardware</strong> provides both <strong
  class="danger">limitations</strong> and <strong
  class="success">opportunities</strong> for the <strong
  class="caution">operating system</strong>, which is in charge of managing these
  resources efficiently on behalf of the <strong
  class="special">applications</strong>.

  <div class="centered">
  <img src="static/img/house-of-cards.png" class="responsive transparent">
  </div>

  As <strong class="info">hardware</strong> evolves, so must the <strong
  class="caution">operating system</strong> in order for it to take advantage of
  new developments and expose them to <strong
  class="special">applications</strong>.

