  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### <span class="primary">Embedded</span>

  Run on resource constrained devices that are not usually used for general
  purpose computing (*TVs, cars, microwaves, etc.*)

  <div class="centered">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/QNX-Logo-QNX-CORAL-RGB.svg/960px-QNX-Logo-QNX-CORAL-RGB.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" class="transparent responsive">
