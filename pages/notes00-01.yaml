  ## Syllabus

  ### Syllabus: <strong class="gold">Ice Breaker</strong>

  - Go row by row (*asking people their name*)

  ### Syllabus: <strong class="gold">Whoami?</strong>

  - **Triple Domer**, **Children**
  - Introduce **TAs** (*if present*)

  ### Syllabus: <strong class="gold">Motivation</strong>

  - Understanding how **software** interacts with **hardware** is crucial for
  **SECURITY** and **performance**

  - <div class="flex-col">

      **House of Cards**:

      - Applications: shell, filters (grep, sed, regular expressions)
      - Standard Library: `printf`, system calls
      - Operating System: kernel (*focus on principles*)

  ### Syllabus: <strong class="gold">Logistics</strong>

  - Explain why we have **Readings** (*need regular practice*)

  - **Honor Code**: encouraged to **work together** and teach each other but
  **sharing solutions is not helping**; use **AI** as if they were a **TA**

